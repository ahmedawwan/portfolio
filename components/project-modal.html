<div class="modal-container" data-modal-container>
  <div class="overlay" data-overlay></div>

  <section class="project-modal" data-project-modal>
    <button
      class="modal-close-btn"
      data-modal-close-btn
      aria-label="Close project details"
    >
      <ion-icon name="close-outline"></ion-icon>
    </button>

    <div class="modal-inner">
      <div class="modal-header">
        <h4 class="h3 modal-title" data-modal-title></h4>
      </div>

      <div class="modal-body">
        <div class="modal-media">
          <figure class="modal-avatar-box">
            <img src="" alt="Project Image" width="80" data-modal-img />
          </figure>
        </div>

        <div class="modal-content">
          <div class="modal-description" data-modal-text>
            <p></p>
          </div>

          <div class="modal-expertise">
            <h5 class="modal-section-title">Technical Expertise</h5>
            <div class="expertise-tags" data-modal-expertise></div>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <a
          href=""
          class="project-link project-link--icon"
          target="_blank"
          rel="noopener noreferrer"
          data-playstore-link
        >
          <ion-icon name="logo-google-playstore" aria-hidden="true"></ion-icon>
        </a>
        <a
          href=""
          class="project-link project-link--icon"
          target="_blank"
          rel="noopener noreferrer"
          data-appstore-link
        >
          <ion-icon name="logo-apple" aria-hidden="true"></ion-icon>
        </a>
        <a
          href=""
          class="project-link project-link--icon"
          target="_blank"
          rel="noopener noreferrer"
          data-amazon-link
        >
          <ion-icon name="logo-amazon" aria-hidden="true"></ion-icon>
        </a>
        <a
          href=""
          class="project-link project-link--icon"
          target="_blank"
          rel="noopener noreferrer"
          data-web-link
        >
          <ion-icon name="globe-outline" aria-hidden="true"></ion-icon>
        </a>
        <a
          href=""
          class="project-link project-link--icon"
          target="_blank"
          rel="noopener noreferrer"
          data-github-link
        >
          <ion-icon name="logo-github" aria-hidden="true"></ion-icon>
        </a>
      </div>
    </div>
  </section>
</div>
